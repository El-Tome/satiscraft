org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official

## Pinned versions. Bumping any of them is a dedicated task.
# https://projects.neoforged.net/neoforged/neoforge
minecraft_version=26.3
minecraft_version_range=[26.3]
neo_version=26.3.0.76
moddev_version=2.0.148
# Must match the Kotlin stdlib bundled by Kotlin for Forge (6.4.0 ships Kotlin 2.4.0).
kotlin_version=2.4.0
kff_version=6.4.0
junit_version=6.1.3
# Must match the slf4j-api that Minecraft ships: unit tests, which run without Minecraft, need it.
slf4j_version=2.0.17
java_version=25

## Metadata shared by the three mods.
# The version is NOT here: it is read from [workspace.package] in Cargo.toml.
# Each mod id is its project name with underscores; names and descriptions are in its template.
mod_license=PolyForm-Noncommercial-1.0.0
mod_authors=Tom Chaumette
mod_group_id=io.github.eltome.satiscraft
